<svg
  width="100%"
  height="200"
  viewBox="0 0 854 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Background Deep Abyss Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Waving Ribbon 1 (Deep Indigo to Ocean Cyan) -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>

    <!-- Waving Ribbon 2 (Bioluminescent Cyan to Emerald) -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75" />
    </linearGradient>

    <!-- Text Glow & Shadow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="854" height="200" fill="url(#bgGrad)" rx="10" />

  <!-- Flowing Abyssal Waves (Bottom) -->
  <path
    d="M 0 135 Q 213 175 427 140 T 854 165 L 854 200 L 0 200 Z"
    fill="url(#wave1)"
  />
  <path
    d="M 0 152 Q 220 120 440 155 T 854 142 L 854 200 L 0 200 Z"
    fill="url(#wave2)"
  />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="120" cy="45" r="70" fill="#0284c7" opacity="0.12" filter="blur(25px)" />
  <circle cx="720" cy="55" r="90" fill="#06b6d4" opacity="0.1" filter="blur(30px)" />

  <!-- Center Text Group -->
  <g text-anchor="middle" filter="url(#textGlow)">
    <!-- Main Title -->
    <text
      x="427"
      y="84"
      fill="#ffffff"
      font-size="46"
      font-weight="800"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      letter-spacing="-0.5"
    >
      Adarsh Singh
    </text>

    <!-- Subtitle / Title Description -->
    <text
      x="427"
      y="124"
      fill="#bae6fd"
      font-size="16.5"
      font-weight="500"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      letter-spacing="0.2"
    >
      Distributed Systems &amp; AI Infrastructure Engineer | Full Stack Developer
    </text>
  </g>
</svg>
